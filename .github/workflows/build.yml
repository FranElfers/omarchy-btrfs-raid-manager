name: Build & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-validate:
    name: Lint & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      - name: Validate Polkit Policy XML
        run: |
          sudo apt-get update && sudo apt-get install -y libxml2-utils
          xmllint --noout polkit/org.omarchy.btrfs.raidmanager.policy

      - name: Validate Systemd Units
        run: |
          sudo apt-get install -y systemd
          systemd-analyze verify systemd/btrpool-scrub@.service systemd/btrpool-scrub@.timer systemd/btrpool-balance@.service systemd/btrpool-balance@.timer

      - name: Validate Plugin Manifest
        run: |
          sudo apt-get install -y jq
          # Verify manifest schema version and required fields matching Omarchy shell specification
          jq -e '.schemaVersion == 1' manifest.json
          jq -e '.id and .name and .version and .kinds and .entryPoints' manifest.json
          jq -e '.kinds | index("bar-widget") != null' manifest.json
          jq -e '.entryPoints.barWidget == "qml/Applet.qml"' manifest.json
          test -f "$GITHUB_WORKSPACE/$(jq -r .entryPoints.barWidget manifest.json)"

  cross-compile:
    name: Cross Compile Go Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            artifact_name: raid-manager-linux-amd64
          - goarch: arm64
            artifact_name: raid-manager-linux-arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Build Binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-s -w" -o bin/${{ matrix.artifact_name }} ./cmd/raid-manager

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: bin/${{ matrix.artifact_name }}
